[platformio]
; --- Entornos de compilación ---
default_envs = test_motor_lazo_abierto, nodo_maestro, esclavo2, esclavo3, nema17_control, nema17_control_matlab, i2c_scanner, test_finde_carrera

; --- Configuración común para todas las placas ---
[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 9600
build_flags = -DENABLE_HWSERIAL2
lib_deps = 
    waspinator/AccelStepper
    RobTillaart/AS5600

; --- Entorno para el NODO MAESTRO ---
; Compila únicamente el código que se encuentra en la carpeta src/maestro/
[env:nodo_maestro]
src_filter = +<maestro/>

; --- Entorno para el NODO ESCLAVO 2 ---
; Compila únicamente el código que se encuentra en la carpeta src/esclavo/
; Para este entorno, la constante SLAVE_ID en main.cpp debe ser 2
[env:esclavo2]
src_filter = +<esclavo/>

; --- Entorno para el NODO ESCLAVO 3 ---
; Compila únicamente el código que se encuentra en la carpeta src/esclavo/
; Para este entorno, la constante SLAVE_ID en main.cpp debe ser 3
[env:esclavo3]
src_filter = +<esclavo/>

; --- Entorno para Nema17 control ---
; Compila únicamente el código que se encuentra en la carpeta src/Nema 17 control giro multiples angulos/
[env:nema17_control]
src_filter = +<Nema 17 control giro multiples angulos/>
monitor_speed = 115200

; --- Entorno para Nema17 control desde MATLAB ---
; Compila únicamente el código que se encuentra en la carpeta src/Nema 17 control giro multiples angulos matlab/
[env:nema17_control_matlab]
src_filter = +<Nema 17 control giro multiples angulos matlab/>
monitor_speed = 115200

; --- Entorno para I2C Scanner ---
; Compila únicamente el código que se encuentra en la carpeta src/scanner_i2c/
[env:i2c_scanner]
src_filter = +<scanner_i2c/>
monitor_speed = 115200

; --- Entorno para Test Motor Lazo Abierto ---
; Compila únicamente el código que se encuentra en la carpeta src/test_motor_lazo_abierto/
[env:test_motor_lazo_abierto]
src_filter = +<test_motor_lazo_abierto/>
monitor_speed = 115200

; --- Entorno para Test Fin de Carrera ---
; Compila únicamente el código que se encuentra en la carpeta src/test_FinDeCarrera
[env:test_finde_carrera]
src_filter = +<test_FinDeCarrera/>
monitor_speed = 115200

; --- Entorno para Test de Servomotor ---
; Compila únicamente el código que se encuentra en la carpeta src/test_servo/
[env:test_servo]
src_filter = +<test_servo/>
monitor_speed = 115200 